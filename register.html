<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Register | Mai Goro e-Digital Solutions</title>
<script>document.documentElement.classList.toggle('customer-light', localStorage.getItem('mai-goro-theme') !== 'dark');</script>
<link rel="icon" type="image/webp" href="img/logo.webp">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563eb; --indigo:#4338ca; --navy:#152a63;
    --text:#ffffff; --muted:rgba(255,255,255,.62); --label:rgba(255,255,255,.75);
    --field:rgba(255,255,255,.07); --field-border:rgba(255,255,255,.16);
    --danger:#dc2626;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Poppins',sans-serif;color:var(--text);
    min-height:100vh;display:flex;padding:24px;position:relative;overflow-x:hidden;
    background:
      radial-gradient(900px 380px at 50% 118%, rgba(67,72,180,.45), transparent 70%),
      radial-gradient(2px 2px at 12% 18%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(1.5px 1.5px at 28% 8%,  rgba(255,255,255,.4), transparent 60%),
      radial-gradient(2px 2px at 68% 12%, rgba(255,255,255,.5), transparent 60%),
      radial-gradient(1.5px 1.5px at 84% 24%, rgba(255,255,255,.35), transparent 60%),
      radial-gradient(1.5px 1.5px at 46% 28%, rgba(255,255,255,.3), transparent 60%),
      radial-gradient(2px 2px at 92% 8%,  rgba(255,255,255,.45), transparent 60%),
      linear-gradient(180deg, #0c1734 0%, #132350 42%, #1d3170 72%, #26408c 100%);
    background-attachment:fixed;
  }
  .glass-card{
    margin:auto;width:100%;max-width:440px;
    background:rgba(13,23,52,.55);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    backdrop-filter:blur(18px) saturate(140%);
    border:1px solid rgba(255,255,255,.14);border-radius:28px;
    box-shadow:0 30px 80px rgba(4,10,30,.5);
    padding:36px 34px 26px;text-align:center;
    animation:cardIn .65s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  .mark{width:50px;height:50px;margin:0 auto 12px;border-radius:50%;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);
    display:grid;place-items:center;font-size:20px;font-weight:700;color:#fff}
  .welcome{font-size:28px;font-weight:600;letter-spacing:.5px}
  .welcome span{color:rgba(255,255,255,.5)}
  .sub{font-size:12.5px;line-height:1.6;color:var(--muted);margin:8px auto 20px;max-width:330px}
  .field{text-align:left;margin-bottom:13px}
  .field label{display:block;font-size:11.5px;font-weight:500;color:var(--label);margin-bottom:6px;letter-spacing:.3px}
  .pill-wrap{position:relative}
  input[type=email], input[type=text], input[type=password], input[type=tel]{
    width:100%;padding:11px 16px;border:1px solid var(--field-border);border-radius:12px;
    font-size:13.5px;font-family:inherit;color:#fff;background:var(--field);
    transition:border .2s, box-shadow .2s, background .2s;
  }
  input::placeholder{color:rgba(255,255,255,.4)}
  input:focus{outline:none;border-color:rgba(255,255,255,.45);
    box-shadow:0 0 0 3px rgba(37,99,235,.35);background:rgba(255,255,255,.1)}
  .hint{font-size:11px;color:rgba(255,255,255,.45);margin-top:4px}
  .pw-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:34px;height:34px;display:grid;place-items:center;
    background:none;border:none;border-radius:50%;color:rgba(255,255,255,.55);cursor:pointer;
    transition:color .2s, background .2s}
  .pw-toggle:hover{color:#fff;background:rgba(255,255,255,.1)}
  .pw-toggle svg{width:18px;height:18px;stroke:currentColor}
  .pw-toggle .eye-off{display:none}
  .pw-toggle[aria-pressed="true"] .eye{display:none}
  .pw-toggle[aria-pressed="true"] .eye-off{display:block}

  /* ── 4-Digit Transaction PIN Boxes (Naijaverify Standard) ── */
  .pin-container { text-align: left; margin: 14px 0 16px; }
  .pin-container label { display: block; font-size: 11.5px; font-weight: 500; color: var(--label); margin-bottom: 7px; }
  .pin-row { display: flex; gap: 10px; justify-content: space-between; }
  .pin-digit {
    flex: 1; height: 48px; text-align: center; font-size: 20px; font-weight: 700;
    border: 1.5px solid var(--field-border); border-radius: 10px; background: var(--field);
    color: #fff; transition: all 0.2s; outline: none;
  }
  .pin-digit:focus {
    border-color: rgba(255,255,255,0.6);
    box-shadow: 0 0 0 3px rgba(37,99,235,.35);
    background: rgba(255,255,255,0.12);
  }
  .pin-toggle { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--muted); margin-top: 7px; cursor: pointer; }
  .pin-toggle input { accent-color: var(--blue); cursor: pointer; }

  button[type=submit]{
    width:100%;padding:13px 22px;border:none;border-radius:999px;
    background:#fff;color:var(--navy);font-size:14.5px;font-weight:600;font-family:inherit;
    cursor:pointer;box-shadow:0 12px 30px rgba(4,10,30,.35);
    transition:transform .15s ease, box-shadow .2s ease, opacity .2s;
    margin-top: 6px;
  }
  button[type=submit]:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 16px 36px rgba(4,10,30,.45)}
  button[type=submit]:disabled{opacity:.65;cursor:not-allowed}
  button[type=submit].is-loading::before{
    content:'';display:inline-block;width:14px;height:14px;margin-right:8px;vertical-align:-2px;
    border:2px solid rgba(21,42,99,.3);border-top-color:var(--navy);border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .notice{display:none;border-radius:12px;padding:10px 14px;font-size:12.5px;margin-top:14px;text-align:left}
  .notice.error{background:rgba(220,38,38,.14);color:#fca5a5;border:1px solid rgba(220,38,38,.4)}
  .notice.info{background:rgba(37,99,235,.16);color:#93c5fd;border:1px solid rgba(37,99,235,.4)}
  .notice.ok{background:rgba(16,185,129,.14);color:#6ee7b7;border:1px solid rgba(16,185,129,.4)}
  .privacy{font-size:11px;color:rgba(255,255,255,.45);margin-top:12px;line-height:1.6}
  .login{margin-top:16px;font-size:12.5px;color:var(--muted)}
  .login a{font-weight:600;color:#fff;text-decoration:none}
  .login a:hover{text-decoration:underline}
  .back{display:inline-block;margin-top:12px;font-size:11.5px;color:rgba(255,255,255,.45);text-decoration:none;transition:color .2s}
  .back:hover{color:#fff}

  /* Light Theme */
  html.customer-light body{color:#172536;background:radial-gradient(800px 380px at 90% 0%,rgba(20,131,125,.1),transparent 70%),radial-gradient(800px 420px at 10% 100%,rgba(37,99,168,.12),transparent 70%),#f3f7fb}
  html.customer-light .glass-card{background:rgba(255,255,255,.95);border-color:#dce5ef;box-shadow:0 24px 70px rgba(31,57,85,.12)}
  html.customer-light .mark{background:#e8f1ff;border-color:#c9d9ee;color:#245da8}
  html.customer-light .welcome span{color:#245da8}
  html.customer-light .sub,html.customer-light .login,html.customer-light .privacy,html.customer-light .pin-toggle{color:#536579}
  html.customer-light .field label, html.customer-light .pin-container label{color:#34475b}
  html.customer-light .hint{color:#6c7c8e}
  html.customer-light input[type=email],html.customer-light input[type=text],html.customer-light input[type=password],html.customer-light input[type=tel],html.customer-light .pin-digit{color:#172536;background:#f8fbff;border-color:#cad7e5}
  html.customer-light input::placeholder{color:#748398}
  html.customer-light input:focus, html.customer-light .pin-digit:focus{border-color:#3976bb;box-shadow:0 0 0 3px rgba(37,99,168,.16);background:#fff}
  html.customer-light .pw-toggle{color:#536579}
  html.customer-light .pw-toggle:hover{color:#174579;background:#e8f1ff}
  html.customer-light button[type=submit]{background:#245da8;color:#fff;box-shadow:0 10px 24px rgba(36,93,168,.2)}
  html.customer-light button[type=submit].is-loading::before{border-color:rgba(255,255,255,.35);border-top-color:#fff}
  html.customer-light .notice.error{background:#fff1f0;color:#a52822;border-color:#f0c4c0}
  html.customer-light .notice.info{background:#eef6ff;color:#174579;border-color:#c5daf1}
  html.customer-light .notice.ok{background:#ecfdf5;color:#12633e;border-color:#b5e5ce}
  html.customer-light .login a{color:#245da8}
  html.customer-light .back{color:#6c7c8e}
  html.customer-light .back:hover{color:#174579}
</style>
</head>
<body>

  <main class="glass-card">
    <div class="mark" aria-hidden="true">M</div>

    <h1 class="welcome">Create <span>Account</span></h1>
    <p class="sub">Register on Nigeria's trusted verification &amp; exam services platform.</p>

    <form id="signupForm">
      <div class="field">
        <label for="fullname">Full Name *</label>
        <input type="text" id="fullname" required autofocus autocomplete="name" placeholder="e.g. Ibrahim Abubakar">
      </div>

      <div class="field">
        <label for="username">Username *</label>
        <input type="text" id="username" required autocomplete="username" placeholder="e.g. ibrahim99">
      </div>

      <div class="field">
        <label for="email">Email Address *</label>
        <input type="email" id="email" required autocomplete="email" placeholder="e.g. ibrahim@gmail.com">
      </div>

      <div class="field">
        <label for="phone">Phone Number *</label>
        <input type="tel" id="phone" required autocomplete="tel" inputmode="tel" placeholder="e.g. 08144372466">
        <div class="hint">Active WhatsApp number for instant verification updates.</div>
      </div>

      <div class="field">
        <label for="password">Password *</label>
        <div class="pill-wrap">
          <input type="password" id="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters">
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password" aria-pressed="false">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"></path>
              <circle cx="12" cy="12" r="2.6"></circle>
            </svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4l16 16"></path>
              <path d="M9.9 5.7A9.9 9.9 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5a17.6 17.6 0 0 1-3.5 4.2M6.3 7.8A17.4 17.4 0 0 0 2 12s3.6 6.5 10 6.5a9.7 9.7 0 0 0 3.7-.7"></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="confirm">Confirm Password *</label>
        <input type="password" id="confirm" required autocomplete="new-password" placeholder="Repeat your password">
      </div>

      <!-- 4-Digit Transaction PIN Section (Naijaverify Benchmark) -->
      <div class="pin-container">
        <label>Transaction Security PIN (4 Digits) *</label>
        <div class="pin-row">
          <input type="password" maxlength="1" pattern="[0-9]*" inputmode="numeric" id="pin1" class="pin-digit" required>
          <input type="password" maxlength="1" pattern="[0-9]*" inputmode="numeric" id="pin2" class="pin-digit" required>
          <input type="password" maxlength="1" pattern="[0-9]*" inputmode="numeric" id="pin3" class="pin-digit" required>
          <input type="password" maxlength="1" pattern="[0-9]*" inputmode="numeric" id="pin4" class="pin-digit" required>
        </div>
        <div class="pin-toggle">
          <input type="checkbox" id="showPin">
          <label for="showPin" style="margin:0;cursor:pointer;">Show PIN digits</label>
        </div>
      </div>

      <button type="submit" id="signupBtn"><i class="fa-solid fa-user-plus"></i> Create Account</button>
      <div class="notice" id="noticeBox" role="alert" aria-live="polite"></div>
    </form>

    <p class="privacy">Your details and identity records are NDPR compliant and securely encrypted.</p>

    <p class="login">Already have an account? <a href="login.html">Sign In</a></p>

    <a class="back" href="index.html">← Back to website</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/slider-config.js"></script>
  <script>
    // Already logged in? Redirect to portal
    if (typeof sb !== 'undefined') {
      sb.auth.getSession().then(({ data }) => {
        if (data && data.session) window.location.replace('portal.html');
      });
    }

    const nameField   = document.getElementById('fullname');
    const userField   = document.getElementById('username');
    const emailField  = document.getElementById('email');
    const phoneField  = document.getElementById('phone');
    const passField   = document.getElementById('password');
    const confirmField= document.getElementById('confirm');
    const pin1        = document.getElementById('pin1');
    const pin2        = document.getElementById('pin2');
    const pin3        = document.getElementById('pin3');
    const pin4        = document.getElementById('pin4');
    const showPin     = document.getElementById('showPin');
    const form        = document.getElementById('signupForm');
    const btn         = document.getElementById('signupBtn');
    const box         = document.getElementById('noticeBox');

    // Password visibility toggle
    const pwToggle = document.getElementById('pwToggle');
    pwToggle.addEventListener('click', () => {
      const showing = passField.type === 'text';
      passField.type = showing ? 'password' : 'text';
      pwToggle.setAttribute('aria-pressed', String(!showing));
    });

    // Auto-advance PIN digits
    const pinInputs = [pin1, pin2, pin3, pin4];
    pinInputs.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        const val = e.target.value.replace(/[^0-9]/g, '');
        e.target.value = val;
        if (val && idx < 3) pinInputs[idx + 1].focus();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && idx > 0) {
          pinInputs[idx - 1].focus();
        }
      });
    });

    // Toggle PIN visibility
    showPin.addEventListener('change', () => {
      const type = showPin.checked ? 'text' : 'password';
      pinInputs.forEach(i => i.type = type);
    });

    function showNotice(message, type = 'error') {
      box.textContent = message;
      box.className = 'notice ' + type;
      box.style.display = 'block';
    }

    const NG_PHONE = /^(\+?234|0)[789][01]\d{8}$/;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      box.style.display = 'none';

      const fullname = nameField.value.trim();
      const username = userField.value.trim();
      const email    = emailField.value.trim().toLowerCase();
      const phone    = phoneField.value.trim().replace(/[\s-]/g, '');
      const password = passField.value;
      const confirm  = confirmField.value;
      const pin      = pin1.value + pin2.value + pin3.value + pin4.value;

      if (!fullname) { showNotice('Please enter your full name.'); return; }
      if (!username || username.length < 3) { showNotice('Username must be at least 3 characters.'); return; }
      if (!NG_PHONE.test(phone)) { showNotice('Please enter a valid 11-digit Nigerian phone number.'); return; }
      if (password.length < 6) { showNotice('Password must be at least 6 characters.'); return; }
      if (password !== confirm) { showNotice('Passwords do not match.'); return; }
      if (!/^\d{4}$/.test(pin)) { showNotice('Please enter a 4-digit transaction security PIN.'); return; }

      btn.disabled = true;
      btn.classList.add('is-loading');
      btn.innerHTML = 'Creating account…';

      try {
        const { data, error } = await sb.auth.signUp({
          email,
          password,
          options: {
            data: {
              full_name: fullname,
              username: username,
              phone: phone,
              transaction_pin: pin,
              bvn_verified: false,
              virtual_account: null
            }
          }
        });

        if (error) {
          btn.disabled = false;
          btn.classList.remove('is-loading');
          btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
          showNotice(error.message || 'Registration failed.');
          return;
        }

        // If email confirmation is required by Supabase settings:
        if (data.user && (!data.session)) {
          btn.disabled = false;
          btn.classList.remove('is-loading');
          btn.innerHTML = '<i class="fa-solid fa-check"></i> Check Email';
          showNotice('Account created! Please check your email to confirm your account, then log in.', 'ok');
          setTimeout(() => { window.location.href = 'login.html'; }, 3000);
          return;
        }

        // Auto login success
        showNotice('Account created successfully! Redirecting to portal…', 'ok');
        setTimeout(() => { window.location.href = 'portal.html'; }, 1000);

      } catch (err) {
        btn.disabled = false;
        btn.classList.remove('is-loading');
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
        showNotice(err.message || 'Connection error. Please try again.');
      }
    });
  </script>
</body>
</html>
