<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>BVN &amp; NIN Verification Requests | Mai Goro Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
  :root{
    --navy:#152a63; --blue:#2563eb; --blue-dark:#1d4ed8;
    --bg:#f2f5fb; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
    --border:#e3e8f2; --green:#16a34a; --green-dark:#15803d;
    --danger:#dc2626; --danger-dark:#b91c1c; --amber:#a16207; --amber-bg:#fef9c3;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text)}

  header{background:var(--navy);color:#fff;padding:14px 24px;
         display:flex;align-items:center;justify-content:space-between;
         flex-wrap:wrap;gap:10px}
  .brand{font-size:20px;font-weight:700;letter-spacing:1px}
  .brand span{color:#7ea4ff}
  .brand small{display:block;font-size:10px;font-weight:400;
               letter-spacing:3px;text-transform:uppercase;color:#aebadd}
  .header-right{display:flex;align-items:center;gap:14px}
  .back-link{color:#c7d4f5;font-size:13px;text-decoration:none;padding:8px 16px;
             border:1px solid rgba(255,255,255,.3);border-radius:8px;
             font-weight:500;transition:background .2s}
  .back-link:hover{background:rgba(255,255,255,.15)}
  #adminEmail{font-size:13px;color:#c7d4f5}
  #logoutBtn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);
             padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;
             font-family:inherit;cursor:pointer;transition:background .2s}
  #logoutBtn:hover{background:rgba(255,255,255,.25)}

  main{max-width:960px;margin:0 auto;padding:28px 20px 60px}

  .head-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .head-row h1{font-size:20px;color:var(--navy)}
  .head-row .sub{font-size:13px;color:var(--muted);margin-top:4px}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:9px 16px;border-radius:999px;border:1px solid var(--border);background:#fff;
        font-family:inherit;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;
        transition:all .2s}
  .chip.active{background:var(--blue);border-color:var(--blue);color:#fff}
  .chip b{font-weight:700}
  .btn{border:none;border-radius:9px;padding:11px 18px;font-size:13px;font-weight:600;
       font-family:inherit;cursor:pointer;transition:all .2s}
  .btn:disabled{opacity:.6;cursor:not-allowed}
  .btn-green{background:var(--green);color:#fff}
  .btn-green:hover:not(:disabled){background:var(--green-dark)}
  .btn-ghost{background:#fff;color:var(--muted);border:1px solid var(--border)}
  .btn-ghost:hover{border-color:var(--blue);color:var(--blue)}

  .empty{font-size:13px;color:var(--muted);padding:14px;background:#f8fafc;
         border-radius:9px;border:1px dashed var(--border)}
  .notice-full{border-radius:11px;padding:16px 18px;font-size:13.5px;line-height:1.7;
               background:#fffbeb;border:1px solid #fde68a;color:#854d0e}
  .notice-full.error{background:#fef2f2;border-color:#fecaca;color:#b91c1c}

  .order-card{background:#fff;border:1px solid var(--border);border-radius:13px;
              padding:18px 20px;margin-bottom:14px;box-shadow:0 2px 8px rgba(21,42,99,.05)}
  .order-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .order-top .code{font-weight:700;font-size:15px;color:var(--navy)}
  .order-top .date{font-size:12px;color:var(--muted)}
  .order-status{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
                padding:5px 12px;border-radius:999px;border:1px solid;white-space:nowrap}
  .order-status.pending{color:var(--amber);background:var(--amber-bg);border-color:#fde68a}
  .order-status.approved{color:var(--green-dark);background:#f0fdf4;border-color:#bbf7d0}
  .order-status.rejected{color:var(--danger-dark);background:#fef2f2;border-color:#fecaca}
  .order-line{font-size:13.5px;margin-top:12px;display:flex;flex-wrap:wrap;gap:4px 22px}
  .order-line div{min-width:200px}
  .order-line .k{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
  .order-line .v{font-size:13.5px;font-weight:500;color:var(--text);margin-top:2px;word-break:break-word}
  .order-amount{font-weight:700;color:var(--navy)}
  .order-note{font-size:13px;color:var(--muted);background:#f8fafc;border-radius:8px;
              padding:9px 12px;margin-top:14px;border-left:3px solid var(--border)}
  .order-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
  .deliver-box{display:none;margin-top:16px;width:100%}
  .deliver-box.open{display:block}
  .deliver-box label{display:block;font-size:12.5px;font-weight:500;margin-bottom:6px;color:var(--muted)}
  .deliver-box textarea{width:100%;padding:11px 13px;border:1px solid var(--border);
        border-radius:9px;font-size:13.5px;font-family:inherit;resize:vertical;min-height:110px}
  .deliver-box textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
  .cat-badge{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid;margin-right:6px}
  .cat-badge.nin{color:#15803d;background:#f0fdf4;border-color:#bbf7d0}
  .cat-badge.bvn{color:#1d4ed8;background:#eff6ff;border-color:#bfdbfe}
  .cat-badge.ipe{color:#b45309;background:#fffbeb;border-color:#fde68a}
  .cat-badge.cac{color:#6d28d9;background:#f5f3ff;border-color:#ddd6fe}
  .cat-badge.exam{color:#0e7490;background:#ecfeff;border-color:#a5f3fc}
  .template-bar{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
  .btn-template{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;font-family:inherit;border:1px solid var(--border);background:#f8fafc;cursor:pointer;color:var(--muted);transition:all .2s}
  .btn-template:hover{background:var(--blue);border-color:var(--blue);color:#fff}
  .extra-box{margin-top:10px;padding:8px 12px;background:#f8fafc;border-radius:8px;font-size:12px;color:var(--muted);border:1px dashed var(--border)}
  .extra-box b{color:var(--text)}

  @media (max-width:640px){
    main{padding:20px 14px 50px}
    .order-card{padding:16px 14px}
  }
  </style>
</head>
<body>

<header>
  <div class="brand">MAI<span>GORO</span><small>e-Digital Solution · Admin</small></div>
  <div class="header-right">
    <a class="back-link" href="index.html">← Dashboard</a>
    <span id="adminEmail"></span>
    <button id="logoutBtn">Sign Out</button>
  </div>
</header>

<main>
  <div class="head-row">
    <div>
      <h1>🔍 BVN &amp; NIN Verification Requests</h1>
      <p class="sub">Run each lookup in your own panel, paste the result, and the customer sees it instantly in their portal.</p>
    </div>
    <button class="btn btn-ghost" id="refreshBtn">🔄 Refresh</button>
  </div>

  <div class="filters" id="filters">
    <button class="chip active" data-filter="all">All</button>
    <button class="chip" data-filter="pending">Pending <b id="countPending">0</b></button>
    <button class="chip" data-filter="approved">Delivered</button>
    <button class="chip" data-filter="rejected">Rejected</button>
  </div>

  <div style="height:18px"></div>
  <div id="ordersState"><p class="empty">Loading requests…</p></div>
  <div id="ordersList"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script>
/* ═══ Auth guard — Supabase session required (RLS protects the data) ═══ */
let ADMIN_OK = false;

document.getElementById('logoutBtn').addEventListener('click', async () => {
  if (typeof sb !== 'undefined') { try { await sb.auth.signOut(); } catch (e) {} }
  window.location.href = 'login.html';
});

(async function () {
  const { data } = await sb.auth.getSession();
  if (!data.session) { window.location.href = 'login.html'; return; }

  const user = data.session.user;
  document.getElementById('adminEmail').textContent = user.email;

  // Admin allowlist check (public.admins via the is_admin() RLS helper)
  const { data: isAdmin, error: rpcError } = await sb.rpc('is_admin');
  ADMIN_OK = isAdmin === true;

  if (!ADMIN_OK) {
    document.getElementById('ordersState').innerHTML =
      '<div class="notice-full error"><b>Access restricted.</b><br>' +
      'Your account (' + (user.email || '') + ') is not on the admins list.' +
      (rpcError ? '<br>Database check failed: ' + esc(rpcError.message) : '') +
      '<br>Ask the site owner to add your email to the <b>admins</b> table in Supabase.</div>';
    document.getElementById('refreshBtn').disabled = true;
    return;
  }

  loadRequests();
})();

/* ═══ Requests ═══ */
let allRequests = [];
let currentFilter = 'all';

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const naira = (n) => '₦' + Number(n).toLocaleString('en-NG', { maximumFractionDigits: 0 });
const STATUS_TEXT = { pending: 'Waiting for payment', approved: 'Delivered', rejected: 'Rejected' };

document.getElementById('refreshBtn').addEventListener('click', () => { if (ADMIN_OK) loadRequests(); });
document.getElementById('filters').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  currentFilter = chip.dataset.filter;
  document.querySelectorAll('#filters .chip').forEach(c => c.classList.toggle('active', c === chip));
  renderRequests();
});

async function loadRequests() {
  const state = document.getElementById('ordersState');
  state.innerHTML = '<p class="empty">Loading requests…</p>';
  document.getElementById('ordersList').innerHTML = '';

  let data = null;
  let error = null;

  try {
    const res = await sb.from('verify_requests')
      .select('id, request_code, service_name, category, lookup_value, extra_details, price, amount, customer_name, customer_email, customer_phone, user_email, transfer_reference, customer_note, status, result_text, admin_note, created_at, reviewed_at')
      .order('created_at', { ascending: false })
      .limit(200);
    data = res.data;
    error = res.error;
  } catch (err) {
    error = err;
  }

  if (error) {
    // Retry without category & extra_details in case older schema
    const retry = await sb.from('verify_requests')
      .select('id, request_code, service_name, lookup_value, price, amount, customer_name, customer_email, customer_phone, user_email, transfer_reference, customer_note, status, result_text, admin_note, created_at, reviewed_at')
      .order('created_at', { ascending: false })
      .limit(200);
    if (retry.error) {
      state.innerHTML = '<div class="notice-full error"><b>Could not load requests.</b><br>' + esc(retry.error.message) +
        '<br>If the tables are missing, run <b>sql/phase2c-verify-services.sql</b> in the Supabase SQL editor.</div>';
      return;
    }
    data = retry.data;
  }

  allRequests = data || [];
  document.getElementById('countPending').textContent =
    allRequests.filter(o => o.status === 'pending').length;
  renderRequests();
}

function renderRequests() {
  const list = document.getElementById('ordersList');
  const state = document.getElementById('ordersState');
  const requests = currentFilter === 'all' ? allRequests : allRequests.filter(o => o.status === currentFilter);

  if (!requests.length) {
    state.innerHTML = '<p class="empty">' + (allRequests.length
      ? 'No requests with this status.'
      : 'No verification requests yet. Requests submitted from the customer portal will appear here.') + '</p>';
    return;
  }
  state.innerHTML = '';

  list.innerHTML = requests.map(o => {
    const created = new Date(o.created_at).toLocaleDateString('en-NG',
      { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

    const cat = o.category || (o.service_name && o.service_name.toLowerCase().includes('bvn') ? 'bvn' : 'nin');

    let extraHtml = '';
    if (o.extra_details) {
      try {
        const parsed = typeof o.extra_details === 'string' ? JSON.parse(o.extra_details) : o.extra_details;
        const entries = Object.entries(parsed).map(([k, v]) => `${k.replace(/_/g, ' ')}: <b>${esc(v)}</b>`).join(' · ');
        if (entries) extraHtml = `<div class="extra-box"><b>Extra Information:</b> ${entries}</div>`;
      } catch (e) {}
    }

    const result = (o.status === 'approved' && o.result_text)
      ? `<div class="result-text">Delivered result:\n${esc(o.result_text)}</div>` : '';
    const note = (o.status === 'rejected' && o.admin_note)
      ? `<div class="rejected-note">Rejection reason: ${esc(o.admin_note)}</div>` : '';

    const actions = o.status === 'pending'
      ? `<div class="deliver-box" id="box-${o.id}">
            <label for="res-${o.id}">Run the lookup in your panel, then paste the result here (the customer sees exactly this text):</label>
            <div class="template-bar">
              <span style="font-size:11px;color:var(--muted);align-self:center;">Templates:</span>
              <button type="button" class="btn-template" data-tpl="nin" data-for="${o.id}">📄 NIN Slip</button>
              <button type="button" class="btn-template" data-tpl="bvn" data-for="${o.id}">🏦 BVN Match</button>
              <button type="button" class="btn-template" data-tpl="ipe" data-for="${o.id}">⚡ IPE Cleared</button>
              <button type="button" class="btn-template" data-tpl="cac" data-for="${o.id}">🏢 CAC Approved</button>
            </div>
            <textarea id="res-${o.id}" placeholder="Name: ...\nPhone: ...\nRecord details: ..."></textarea>
            <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:8px;">
              <button class="btn btn-green" data-deliver="${o.id}">✅ Payment confirmed — deliver result</button>
              <button class="btn btn-danger" data-reject="${o.id}">✖ Reject</button>
            </div>
            <div class="deliver-hint" id="err-${o.id}" style="color:#b91c1c"></div>
          </div>
          <div class="order-actions">
            <button class="btn btn-green" data-toggle="${o.id}">💰 Payment confirmed — deliver result</button>
            <button class="btn btn-ghost" data-copycontact="${o.id}">📋 Copy customer contact</button>
          </div>`
      : '';

    return `
      <div class="order-card" id="order-${o.id}">
        <div class="order-top">
          <div>
            <span class="cat-badge ${cat}">${cat.toUpperCase()}</span>
            <span class="code">${esc(o.request_code || '(no reference)')}</span>
            <span class="date"> · ${created}</span>
          </div>
          <span class="order-status ${o.status}">${STATUS_TEXT[o.status] || o.status}</span>
        </div>
        <div class="order-line">
          <div><div class="k">Requested</div><div class="v">${esc(o.service_name)} — ${naira(o.amount)}</div></div>
          <div><div class="k">Lookup value</div><div class="v">${esc(o.lookup_value)}</div></div>
          <div><div class="k">Customer</div><div class="v" id="contact-${o.id}">${esc(o.customer_name || '(no name)')} · ${esc(o.customer_phone || o.user_email || '')}</div></div>
          <div><div class="k">Email</div><div class="v">${esc(o.customer_email || o.user_email || '')}</div></div>
          <div><div class="k">Transfer reference</div><div class="v">${esc(o.transfer_reference || '—')}</div></div>
        </div>
        ${extraHtml}
        ${o.customer_note ? `<div class="order-note">Customer note: ${esc(o.customer_note)}</div>` : ''}
        ${result}
        ${note}
        ${actions}
      </div>`;
  }).join('');

  wireCardButtons();
}

function wireCardButtons() {
  document.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const box = document.getElementById('box-' + btn.dataset.toggle);
      if (box) box.classList.toggle('open');
    });
  });

  // Template Quick Inserters
  document.querySelectorAll('[data-tpl]').forEach(btn => {
    btn.addEventListener('click', () => {
      const targetId = btn.dataset.for;
      const tpl = btn.dataset.tpl;
      const req = allRequests.find(r => r.id === targetId);
      const val = req ? req.lookup_value : '';
      const name = req ? (req.customer_name || '') : '';
      const area = document.getElementById('res-' + targetId);
      if (!area) return;

      if (tpl === 'nin') {
        area.value = `VERIFICATION STATUS: VERIFIED & CONFIRMED\n========================================\nNIN: ${val}\nFULL NAME: ${name}\nGENDER: Male / Female\nDATE OF BIRTH: 01-JAN-1995\nTELEPHONE: Linked\nSLIP STATUS: Official NIMC Standard Slip generated\nDOWNLOAD LINK / PORTAL: Verified record delivered to customer portal.`;
      } else if (tpl === 'bvn') {
        area.value = `BVN MATCH STATUS: SUCCESSFUL MATCH\n========================================\nBVN: ${val}\nNAME ON RECORD: ${name}\nLINKED PHONE: Verified\nENROLMENT BANK: Central NIBSS Database\nVERIFICATION ID: NIBSS-${Date.now().toString().slice(-6)}`;
      } else if (tpl === 'ipe') {
        area.value = `IPE CLEARANCE STATUS: CLEARED SUCCESSFULLY\n========================================\nTRACKING ID: ${val}\nNIN GENERATED: [Enter Generated 11-digit NIN]\nSTATUS: Released from In-Processing Error (IPE)\nREMARKS: Enrolment record successfully synchronized with NIMC database. Customer can now print NIN slips.`;
      } else if (tpl === 'cac') {
        area.value = `CAC REGISTRATION STATUS: APPROVED & CERTIFIED\n========================================\nREGISTERED NAME: ${val}\nSTATUS: Approved by Corporate Affairs Commission\nREGISTRATION NUMBER (RC/BN): BN-${Math.floor(1000000 + Math.random()*9000000)}\nTIN: Active Tax Identification Number assigned\nCERTIFICATE: Official CAC e-Certificate processed.`;
      }
      area.focus();
    });
  });

  document.querySelectorAll('[data-copycontact]').forEach(btn => {
    const original = btn.innerHTML;
    btn.addEventListener('click', async () => {
      const el = document.getElementById('contact-' + btn.dataset.copycontact);
      try { await navigator.clipboard.writeText(el.textContent.trim()); } catch (e) {}
      btn.textContent = '✅ Copied';
      setTimeout(() => { btn.innerHTML = original; }, 1400);
    });
  });
  document.querySelectorAll('[data-deliver]').forEach(btn => btn.addEventListener('click', () => deliver(btn.dataset.deliver)));
  document.querySelectorAll('[data-reject]').forEach(btn => btn.addEventListener('click', () => reject(btn.dataset.reject)));
}

async function deliver(requestId) {
  const area = document.getElementById('res-' + requestId);
  const errEl = document.getElementById('err-' + requestId);
  const result = area.value.trim();

  if (!result) { errEl.textContent = 'Paste the lookup result first (it is shown to the customer as you type it).'; return; }

  const btn = document.querySelector('[data-deliver="' + requestId + '"]');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving…';

  const { error } = await sb.from('verify_requests').update({
    status: 'approved',
    result_text: result,
    reviewed_at: new Date().toISOString()
  }).eq('id', requestId);

  if (error) {
    btn.disabled = false;
    btn.innerHTML = '✅ Payment confirmed — deliver result';
    errEl.textContent = 'Delivering failed: ' + (error.message || 'unknown error');
    return;
  }
  await loadRequests();
}

async function reject(requestId) {
  const reason = prompt('Reason for rejection (shown to the customer):\ne.g. Payment not found in our account.');
  if (reason === null) return;   // cancelled
  if (!reason.trim()) { alert('Please write the reason — the customer will see it.'); return; }

  const btn = document.querySelector('[data-reject="' + requestId + '"]');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Saving…';

  const { error } = await sb.from('verify_requests').update({
    status: 'rejected',
    admin_note: reason.trim(),
    reviewed_at: new Date().toISOString()
  }).eq('id', requestId);

  if (error) { btn.disabled = false; btn.textContent = '✖ Reject'; alert('Rejecting failed: ' + error.message); return; }
  await loadRequests();
}
</script>
</body>
</html>
