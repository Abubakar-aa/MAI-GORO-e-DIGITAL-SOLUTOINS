<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login | Mai Goro e-Digital Solution</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#f59e0b; --indigo:#b45309; --navy:#2b1b0b;
    --text:#ffffff; --muted:rgba(255,255,255,.62); --label:rgba(255,255,255,.75);
    --field:rgba(255,255,255,.07); --field-border:rgba(255,255,255,.16);
    --danger:#dc2626;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  body{
    font-family:'Poppins',sans-serif;color:var(--text);
    min-height:100vh;display:flex;padding:24px;position:relative;overflow-x:hidden;
    background:
      radial-gradient(820px 420px at 50% 112%, rgba(217,119,6,.25), transparent 70%),
      radial-gradient(650px 380px at 100% 0%, rgba(20,83,75,.18), transparent 72%),
      radial-gradient(2px 2px at 12% 18%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(1.5px 1.5px at 28% 8%,  rgba(255,255,255,.4), transparent 60%),
      radial-gradient(2px 2px at 68% 12%, rgba(255,255,255,.5), transparent 60%),
      radial-gradient(1.5px 1.5px at 84% 24%, rgba(255,255,255,.35), transparent 60%),
      radial-gradient(1.5px 1.5px at 46% 28%, rgba(255,255,255,.3), transparent 60%),
      radial-gradient(2px 2px at 92% 8%,  rgba(255,255,255,.45), transparent 60%),
      linear-gradient(155deg, #101516 0%, #171d1c 48%, #242016 100%);
    background-attachment:fixed;
  }

  /* ─────────── Glass card ─────────── */
  .glass-card{
    margin:auto;width:100%;max-width:450px;
    background:rgba(18,23,22,.84);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    backdrop-filter:blur(18px) saturate(140%);
    border:1px solid rgba(245,158,11,.26);
    border-radius:28px;
    box-shadow:0 30px 80px rgba(0,0,0,.48),0 0 50px rgba(217,119,6,.08);
    padding:42px 40px 30px;text-align:center;
    animation:cardIn .65s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

  .mark{
    width:54px;height:54px;margin:0 auto 18px;border-radius:50%;
    background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.42);
    display:grid;place-items:center;font-size:22px;font-weight:700;color:#fbbf24;
  }

  .welcome{font-size:34px;font-weight:600;letter-spacing:.5px}
  .welcome span{color:#fbbf24}
  .role-badge{display:inline-flex;align-items:center;gap:7px;margin-bottom:12px;padding:6px 11px;
    border:1px solid rgba(245,158,11,.4);border-radius:999px;background:rgba(245,158,11,.1);
    color:#fcd58a;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  .role-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:#f59e0b}
  .sub{font-size:13px;line-height:1.7;color:var(--muted);margin:10px auto 26px;max-width:330px}

  /* ─────────── Fields ─────────── */
  .field{text-align:left;margin-bottom:16px}
  .field label{display:block;font-size:12px;color:var(--label);margin-bottom:7px;letter-spacing:.3px}
  .pill-wrap{position:relative}
  input[type=email], input[type=text], input[type=password]{
    width:100%;padding:13px 18px;border:1px solid var(--field-border);border-radius:14px;
    font-size:14px;font-family:inherit;color:#fff;background:var(--field);
    transition:border .2s, box-shadow .2s, background .2s;
  }
  input::placeholder{color:rgba(255,255,255,.42)}
  input:focus{outline:none;border-color:rgba(255,255,255,.45);
    box-shadow:0 0 0 3px rgba(37,99,235,.35);background:rgba(255,255,255,.1)}
  .glass-card input:focus{border-color:rgba(245,158,11,.8);box-shadow:0 0 0 3px rgba(245,158,11,.2)}

  .pw-toggle{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:34px;height:34px;display:grid;place-items:center;
    background:none;border:none;border-radius:50%;color:rgba(255,255,255,.55);cursor:pointer;
    transition:color .2s, background .2s;
  }
  .pw-toggle:hover{color:#fff;background:rgba(255,255,255,.1)}
  .pw-toggle svg{width:18px;height:18px;stroke:currentColor}
  .pw-toggle .eye-off{display:none}
  .pw-toggle[aria-pressed="true"] .eye{display:none}
  .pw-toggle[aria-pressed="true"] .eye-off{display:block}

  /* Remember me / forgot row */
  .row{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 20px}
  .remember{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--label);cursor:pointer}
  .remember input{width:16px;height:16px;accent-color:var(--blue);cursor:pointer}
  .link{background:none;border:none;font-family:inherit;font-size:12.5px;font-weight:500;
    color:var(--label);cursor:pointer;text-decoration:none;transition:color .2s;padding:0}
  .link:hover{color:#fff}

  /* ─────────── Buttons ─────────── */
  button[type=submit]{
    width:100%;padding:14px 22px;border:none;border-radius:999px;
    background:#fff;color:var(--navy);font-size:15px;font-weight:600;font-family:inherit;
    cursor:pointer;box-shadow:0 12px 30px rgba(4,10,30,.35);
    transition:transform .15s ease, box-shadow .2s ease, opacity .2s;
  }
  button[type=submit]:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 16px 36px rgba(4,10,30,.45)}
  button[type=submit]:active:not(:disabled){transform:translateY(0)}
  button[type=submit]:disabled{opacity:.65;cursor:not-allowed}
  button[type=submit].is-loading::before{
    content:'';display:inline-block;width:14px;height:14px;margin-right:8px;vertical-align:-2px;
    border:2px solid rgba(21,42,99,.3);border-top-color:var(--navy);border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  .google-btn{
    width:100%;padding:13px 22px;border-radius:999px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.22);
    color:#fff;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:10px;
    transition:background .2s, border-color .2s, transform .15s ease;
  }
  .google-btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.4);transform:translateY(-1px)}
  .google-btn svg{width:18px;height:18px}

  /* Or divider */
  .divider{display:flex;align-items:center;gap:14px;margin:22px 0;color:var(--muted);font-size:12px}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.16)}

  /* Notices (errors + info) */
  .notice{
    display:none;border-radius:12px;padding:10px 14px;font-size:12.5px;margin-top:16px;text-align:left;
  }
  .notice.error{background:rgba(220,38,128,.14);color:#fca5a5;border:1px solid rgba(220,38,38,.4)}
  .notice.info{background:rgba(37,99,235,.16);color:#93c5fd;border:1px solid rgba(37,99,235,.4)}
  .notice.shake{animation:shake .4s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-6px)} 40%{transform:translateX(5px)}
    60%{transform:translateX(-3px)} 80%{transform:translateX(2px)}
  }

  .signup{margin-top:22px;font-size:12.5px;color:var(--muted)}
  .signup .link{font-weight:600;color:#fff;margin-left:4px}
  .back{display:inline-block;margin-top:16px;font-size:11.5px;color:rgba(255,255,255,.45);
    text-decoration:none;transition:color .2s}
  .back:hover{color:#fff}

  .link:focus-visible, .back:focus-visible, .pw-toggle:focus-visible,
  .google-btn:focus-visible, .remember input:focus-visible{
    outline:3px solid rgba(147,197,253,.7);outline-offset:2px;
  }

  /* ─────────── Mobile ─────────── */
  @media (max-width: 480px){
    body{padding:14px}
    .glass-card{padding:32px 22px 24px;border-radius:24px}
    .welcome{font-size:28px}
    .sub{font-size:12.5px;margin-bottom:22px}
    .mark{width:48px;height:48px;font-size:20px}
  }

  @media (prefers-reduced-motion: reduce){
    .glass-card, .notice.shake, button[type=submit].is-loading::before{animation:none}
    button[type=submit]:hover, .google-btn:hover{transform:none}
  }
</style>
</head>
<body>

  <main class="glass-card">
    <div class="mark" aria-hidden="true">M</div>
    <span class="role-badge">Admin Access</span>

    <h1 class="welcome">Welcome <span>back!</span></h1>
    <p class="sub">Sign in to manage opportunity slides, daily activities and client
      messages for Mai Goro e-Digital Solutions.</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autofocus autocomplete="username" placeholder="Enter your email">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pill-wrap">
          <input type="password" id="password" required autocomplete="current-password" placeholder="Enter your password">
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password" aria-pressed="false">
            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"></path>
              <circle cx="12" cy="12" r="2.6"></circle>
            </svg>
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4l16 16"></path>
              <path d="M9.9 5.7A9.9 9.9 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5a17.6 17.6 0 0 1-3.5 4.2M6.3 7.8A17.4 17.4 0 0 0 2 12s3.6 6.5 10 6.5a9.7 9.7 0 0 0 3.7-.7"></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="row">
        <label class="remember"><input type="checkbox" id="remember"> Remember me</label>
        <button type="button" class="link" id="forgotBtn">Forgot password?</button>
      </div>

      <button type="submit" id="loginBtn">Log In</button>
      <div class="notice" id="errorBox" role="alert" aria-live="polite"></div>
    </form>

    <div class="divider">Or</div>

    <button type="button" class="google-btn" id="googleBtn">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Sign in with Google
    </button>

    <p class="signup">Don't have an account?<button type="button" class="link" id="signupBtn">Sign Up</button></p>

    <a class="back" href="/">← Back to website</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    const API_BASE = (window.location.protocol === 'file:' || (window.location.hostname === 'localhost' && window.location.port !== '5000'))
      ? 'http://localhost:5000/api'
      : '/api';

    // Check if already logged in via Node.js token
    const token = localStorage.getItem('maigoro_token');
    if (token) {
      fetch(`${API_BASE}/auth/me`, {
        headers: { 'Authorization': 'Bearer ' + token }
      }).then(res => {
        if (res.ok) window.location.href = 'index.html';
      }).catch(() => {});
    }

    const emailField    = document.getElementById('email');
    const passwordField = document.getElementById('password');
    const remember      = document.getElementById('remember');
    const form = document.getElementById('loginForm');
    const btn  = document.getElementById('loginBtn');
    const err  = document.getElementById('errorBox');

    // Remember me — persists the email address only (never the password)
    const savedEmail = localStorage.getItem('maigoro_email');
    if (savedEmail) { emailField.value = savedEmail; remember.checked = true; }

    // Show / hide password
    const pwToggle = document.getElementById('pwToggle');
    pwToggle.addEventListener('click', () => {
      const showing = passwordField.type === 'text';
      passwordField.type = showing ? 'password' : 'text';
      pwToggle.setAttribute('aria-pressed', String(!showing));
      pwToggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });

    function showNotice(message, type = 'error') {
      err.textContent = message;
      err.className = 'notice ' + type;
      err.style.display = 'block';
      void err.offsetWidth; // restart the shake animation
      err.classList.add('shake');
    }

    // Forgot password — no self-service reset on the admin panel
    document.getElementById('forgotBtn').addEventListener('click', () => {
      showNotice('Password resets are handled by the Mai Goro administrator — contact them to regain access.', 'info');
    });

    // Sign Up — admin accounts are created by the administrator
    document.getElementById('signupBtn').addEventListener('click', () => {
      showNotice('New admin accounts are created by the Mai Goro administrator — request access from them.', 'info');
    });

    // Google sign-in via Supabase OAuth (enable the Google provider in Supabase to activate)
    document.getElementById('googleBtn').addEventListener('click', async () => {
      if (typeof sb === 'undefined') {
        showNotice('Google sign-in is unavailable right now.', 'error');
        return;
      }
      const adminDir = window.location.origin + window.location.pathname.replace(/login\.html.*$/, '');
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: adminDir }
      });
      if (error) showNotice('Google sign-in isn’t enabled yet — enable the Google provider in your Supabase dashboard.', 'info');
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.classList.add('is-loading');
      btn.textContent = 'Signing in…';
      err.style.display = 'none';

      const email = emailField.value.trim();
      const password = passwordField.value;

      if (remember.checked) localStorage.setItem('maigoro_email', email);
      else localStorage.removeItem('maigoro_email');

      try {
        // Authenticate with our Node.js / SQLite backend
        const response = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await response.json();

        if (response.ok && data.success) {
          localStorage.setItem('maigoro_token', data.token);
          localStorage.setItem('maigoro_user', JSON.stringify(data.user));
          window.location.href = 'index.html';
          return;
        } else {
          showNotice(data.error || 'Login failed. Please check your credentials.');
        }
      } catch (networkErr) {
        // Fallback to Supabase if local backend is offline
        if (typeof sb !== 'undefined') {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (!error) {
            window.location.href = 'index.html';
            return;
          }
        }
        showNotice('Could not connect to backend server. Make sure it is running at http://localhost:5000.');
      } finally {
        btn.disabled = false;
        btn.classList.remove('is-loading');
        btn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
